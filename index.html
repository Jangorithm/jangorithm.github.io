<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jangorithm</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden; 
        }

        .hidden { display: none !important; }
        .stage-container { text-align: center; width: 100%; }

        .play-btn {
            padding: 20px 50px;
            font-size: 2rem;
            font-weight: bold;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        .play-btn:hover { transform: scale(1.1); }

        .game-area {
            position: relative;
            width: 600px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        
        .cup-container {
            position: absolute;
            bottom: 50px;
            width: 100px;
            height: 120px;
            cursor: pointer;
        }

        .cup {
            width: 100%;
            height: 100%;
            background: #d4af37;
            border-radius: 10px 10px 40% 40%;
            border: 4px solid #b38f2d;
            position: relative;
            z-index: 2;
            transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .ball {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: #ff4757;
            border-radius: 50%;
            z-index: 1;
            display: none; 
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.3);
        }
        
        .lifted .cup { transform: translateY(-70px); }
        .ball.visible { display: block; }

        .message { margin-top: 20px; font-size: 1.8rem; height: 40px; font-weight: bold; }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .slot-machine {
            display: flex;
            gap: 2px;
            padding: 20px 40px;
            background: #2b2b2b;
            border-radius: 15px;
            border: 4px solid #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            margin-bottom: 30px;
        }
        .window {
            width: 35px; height: 50px;
            overflow: hidden; background: #ffffff; color: #333;
            border-radius: 4px; position: relative;
            font-weight: bold; font-size: 1.8rem;
        }
        .reel {
            display: flex; flex-direction: column;
            text-align: center; line-height: 50px;
        }
        .copy-btn {
            padding: 12px 30px; font-size: 1.2rem; font-weight: bold;
            color: #1a1a1a; background-color: #00d2ff;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
            opacity: 0; transform: translateY(20px); pointer-events: none;
        }
        .copy-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .copy-btn:hover { background-color: #7ce4ff; transform: scale(1.05); }
        .copy-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="stage-intro" class="stage-container">
    <h1 style="margin-bottom: 40px; font-size: 2.5rem;">TEST YOUR LUCK</h1>
    <button class="play-btn" onclick="startGame()">PLAY GAME</button>
</div>

<div id="stage-game" class="stage-container hidden">
    <h2 style="color: #00d2ff;">FIND THE BALL</h2>
    <div class="game-area">
        <div class="cup-container" id="cup0" style="left: 50px;" onclick="pickCup(0)">
            <div class="cup"></div>
            <div class="ball" id="ball0"></div>
        </div>
        <div class="cup-container" id="cup1" style="left: 250px;" onclick="pickCup(1)">
            <div class="cup"></div>
            <div class="ball" id="ball1"></div>
        </div>
        <div class="cup-container" id="cup2" style="left: 450px;" onclick="pickCup(2)">
            <div class="cup"></div>
            <div class="ball" id="ball2"></div>
        </div>
    </div>
    <div class="message" id="gameMessage"></div>
</div>

<div id="stage-result" class="stage-container hidden slot-wrapper">
    <h2 style="color: #4cd964; font-size: 2.5rem; margin-bottom: 30px;">CONGRATULATIONS!</h2>
    <div class="slot-machine" id="slotMachine"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyEmail()">Copy Email</button>
</div>


<script>
    let winningCupIndex = 1; 
    let isShuffling = false;
    
    const positionCoords = [50, 250, 450]; 
    let slots = [0, 1, 2]; 

    function startGame() {
        document.getElementById('stage-intro').classList.add('hidden');
        document.getElementById('stage-game').classList.remove('hidden');
        
        const winningBall = document.getElementById(`ball${winningCupIndex}`);
        const winningCupContainer = document.getElementById(`cup${winningCupIndex}`);
        
        winningBall.classList.add('visible');
        winningCupContainer.classList.add('lifted');
        document.getElementById('gameMessage').innerText = "Watch the ball...";

        setTimeout(() => {
            winningCupContainer.classList.remove('lifted');
            setTimeout(() => {
                winningBall.classList.remove('visible');
                shuffleCups();
            }, 500);
        }, 1500);
    }

    async function shuffleCups() {
        isShuffling = true;
        document.getElementById('gameMessage').innerText = "Shuffling...";
        
        const shuffleCount = 10; 
        const speed = 350; 

        for (let i = 0; i < shuffleCount; i++) {
            let slotA = Math.floor(Math.random() * 3);
            let slotB = (slotA + 1 + Math.floor(Math.random() * 2)) % 3;

            let cupId_A = slots[slotA];
            let cupId_B = slots[slotB];

            let cupElem_A = document.getElementById(`cup${cupId_A}`);
            let cupElem_B = document.getElementById(`cup${cupId_B}`);

            cupElem_A.style.transition = `left ${speed}ms ease-in-out`;
            cupElem_B.style.transition = `left ${speed}ms ease-in-out`;

            cupElem_A.style.left = `${positionCoords[slotB]}px`;
            cupElem_B.style.left = `${positionCoords[slotA]}px`;

            slots[slotA] = cupId_B;
            slots[slotB] = cupId_A;
            
            await new Promise(r => setTimeout(r, speed + 20));
        }

        isShuffling = false;
        document.getElementById('gameMessage').innerText = "Where is the ball?";
    }

    function pickCup(clickedCupId) {
        if (isShuffling) return; 

        const pickedCupContainer = document.getElementById(`cup${clickedCupId}`);
        const ball = document.getElementById(`ball${clickedCupId}`);

        pickedCupContainer.classList.add('lifted');

        if (clickedCupId === winningCupIndex) {
            ball.classList.add('visible');
            document.getElementById('gameMessage').style.color = '#4cd964';
            document.getElementById('gameMessage').innerText = "You found it!";
            isShuffling = true; 

            confetti({
                particleCount: 200,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff4757', '#00d2ff', '#ffffff', '#ffd700']
            });

            setTimeout(() => {
                document.getElementById('stage-game').classList.add('hidden');
                document.getElementById('stage-result').classList.remove('hidden');
                startSlotMachine(); 
            }, 2500);

        } else {
            document.getElementById('gameMessage').style.color = '#ff4757';
            document.getElementById('gameMessage').innerText = "Empty! Try again.";
            setTimeout(() => {
                 pickedCupContainer.classList.remove('lifted');
                 if(!isShuffling) {
                     document.getElementById('gameMessage').style.color = 'white';
                     document.getElementById('gameMessage').innerText = "Where is the ball?";
                 }
            }, 1200);
        }
    }

    function startSlotMachine() {
        const targetText = "kowm6170@naver.com";
        const charPool = "abcdefghijklmnopqrstuvwxyz0123456789@."; 
        const container = document.getElementById('slotMachine');
        const copyBtn = document.getElementById('copyBtn');
        const itemHeight = 50;

        container.innerHTML = ''; 

        function createReel(targetChar, index) {
            const windowDiv = document.createElement('div');
            windowDiv.className = 'window';
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            reelDiv.style.transform = `translateY(${itemHeight}px)`; 

            let content = '';
            const poolLength = charPool.length;
            const loops = 3; 
            
            for (let k = 0; k < loops; k++) {
                for (let i = 0; i < poolLength; i++) {
                    content += `<div>${charPool[i]}</div>`;
                }
            }
            reelDiv.innerHTML = content;
            windowDiv.appendChild(reelDiv);
            container.appendChild(windowDiv);

            setTimeout(() => {
                reelDiv.style.transition = 'transform 2.5s cubic-bezier(0.15, 0.9, 0.25, 1)';
                const targetIndex = charPool.indexOf(targetChar);
                const safeIndex = targetIndex === -1 ? 0 : targetIndex;
                const finalPosition = ((loops - 1) * poolLength + safeIndex) * itemHeight;
                reelDiv.style.transform = `translateY(-${finalPosition}px)`;
            }, 100 + index * 100);
        }

        for (let i = 0; i < targetText.length; i++) {
            createReel(targetText[i], i);
        }

        setTimeout(() => {
            copyBtn.classList.add('show');
        }, 3500);
    }

    function copyEmail() {
        const targetText = "kowm6170@naver.com";
        const copyBtn = document.getElementById('copyBtn');
        navigator.clipboard.writeText(targetText).then(() => {
            const originalText = "Copy Email"; 
            copyBtn.innerText = "Copied! ✅"; 
            copyBtn.style.backgroundColor = "#4cd964"; 
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = "#00d2ff"; 
            }, 2000);
        }).catch(err => { console.error(err); alert('Failed to copy.'); });
    }
</script>

</body>
</html>
